<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勇闖視傳系</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="img/小裝飾/Iconeye1.png" />
    <style>
      img {
        image-rendering: pixelated; /* 讓所有像素圖在高解析度螢幕上保持銳利顆粒感！ */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      /* 滿版遊戲畫面視窗 */
      #game-frame {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
      }
      /* 右上角常駐的像素音樂開關按鈕 */
      #global-bgm-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 46px;
        height: 46px;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* 覆蓋在最上層的復古像素螢幕濾鏡（不影響任何按鈕點擊） */
      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none; /* 關鍵：讓滑鼠完全穿透，不擋住任何按鈕！ */
        z-index: 99999;
        /* 1. 極細的橫向像素掃描線 */
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.12) 50%
        );
        background-size: 100% 4px;
        /* 2. 四周微暗角，把視覺焦點集中在螢幕中央 */
        box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.35);
      }
      /* =========================================
   自訂復古像素鼠標（32x32 px 透明底 PNG）
   ========================================= */

      /* 1. 全域預設鼠標（後面的 0 0 代表點擊熱點在圖片左上角尖端，auto 是備援預設箭頭） */
      html,
      body {
        cursor:
          url("img/小裝飾/滑鼠鼠.png") 0 0,
          auto !important;
      }

      /* 2. 移到所有按鈕、選項、卡片、色塊上的「可點擊手勢鼠標」 */
      a,
      button,
      input[type="button"],
      input[type="submit"],
      .option-item,
      .font-sample-card,
      .font-drop-slot,
      .player-swatch-wrapper,
      .avatar-wrapper,
      .hover-zoom,
      .img-btn,
      .fail-img-btn,
      .close-explain-btn {
        cursor:
          url("img/小裝飾/滑鼠鼠.png") 8 0,
          pointer !important;
      }
    </style>
  </head>
  <body>
    <!-- 1. 全站唯一的背景音樂播放器（永遠不會因為換頁而中斷） -->
    <audio id="global-bgm" src="sound/背景音樂.mp3" loop preload="auto"></audio>

    <!-- 2. 右上角全站通用音樂開關 -->
    <button id="global-bgm-btn" title="開關背景音樂">🔊</button>

    <!-- 3. 滿版遊戲畫面視窗（只保留這一個，並加上 allow="camera *" 允許內部開啟相機） -->
    <iframe id="game-frame" src="0102/01.html" allow="camera *"></iframe>

    <!-- 4. 復古 CRT 螢幕掃描線＋暗角濾鏡 -->
    <div class="crt-overlay"></div>

    <script>
      const bgm = document.getElementById("global-bgm");
      const bgmBtn = document.getElementById("global-bgm-btn");
      const gameFrame = document.getElementById("game-frame");
      bgm.volume = 0.3;

      let isMusicStarted = false;

      // 嘗試一打開網頁就自動播放音樂
      function tryAutoPlay() {
        bgm
          .play()
          .then(() => {
            isMusicStarted = true;
            bgmBtn.textContent = "🔊";
          })
          .catch(() => {
            bgmBtn.textContent = "🔇";
          });
      }

      tryAutoPlay();

      // 監聽內部網頁的第一次點擊，只要玩家點了首頁任何地方，音樂立刻永遠啟動
      gameFrame.addEventListener("load", () => {
        try {
          gameFrame.contentWindow.document.body.addEventListener(
            "click",
            () => {
              if (!isMusicStarted) {
                tryAutoPlay();
              }
            },
            { once: true },
          );
        } catch (e) {}
      });

      // 右上角手動開關按鈕
      bgmBtn.addEventListener("click", () => {
        if (bgm.paused) {
          bgm.play();
          bgmBtn.textContent = "🔊";
          isMusicStarted = true;
        } else {
          bgm.pause();
          bgmBtn.textContent = "🔇";
        }
      });
    </script>
  </body>
</html>
