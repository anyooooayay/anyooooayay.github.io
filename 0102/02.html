<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>勇闖視傳系</title>
    <link rel="stylesheet" href="../css/style02.css" />
    <link rel="icon" type="image/png" href="../img/小裝飾/Iconeye1.png" />
  </head>
  <body>
    <!-- 背景圖 -->
    <img src="../img/背景/03背景.png" class="background-img" alt="背景圖" />

    <!-- 選角頁面專屬音效（請確認音檔名稱與你們資料夾一致） -->
    <audio id="sfx-ready" src="../sound/點.wav" preload="auto"></audio>
    <audio id="sfx-arrow" src="../sound/按鈕聲.wav" preload="auto"></audio>
    <audio id="sfx-ok" src="../sound/點.wav" preload="auto"></audio>

    <!-- ① 角色頁面開場彈窗（半透明黑底 + 圖片 + READY 變色按鈕） -->
    <div id="char-intro-modal" class="intro-overlay">
      <div class="intro-popup-box">
        <img
          class="popup-main-img"
          src="../img/情境框/角色情境.png"
          alt="角色選擇說明"
        />

        <div id="close-intro-btn" class="intro-ready-btn">
          <img
            class="intro-btn-normal"
            src="../img/按鈕/按鈕深ready.png"
            alt="READY"
          />
          <img
            class="intro-btn-hover"
            src="../img/按鈕/按鈕淺ready.png"
            alt="READY"
          />
        </div>
      </div>
    </div>

    <!-- 右下角 NEXT 下一頁按鈕 -->
    <a href="../03/03.html" class="next-page-link">
      <div class="button-box">
        <img class="btn-normal" src="../img/按鈕/按鈕深next.png" alt="按鈕" />
        <img
          class="btn-hover"
          src="../img/按鈕/按鈕淺next.png"
          alt="按鈕變色"
        />
      </div>
    </a>

    <!-- ② 角色選擇輪播區 -->
    <div class="carousel-container">
      <!-- 左右箭頭按鈕 -->
      <button class="arrow-btn arrow-left" onclick="moveSlide(-1)">
        <img src="../img/角色/左劍頭.png" alt="向左切換" />
      </button>
      <button class="arrow-btn arrow-right" onclick="moveSlide(1)">
        <img src="../img/角色/右劍頭.png" alt="向右切換" />
      </button>

      <!-- 角色卡片 1（洪力達） -->
      <div class="card pos-left" data-char="角色 1">
        <img src="../img/角色/背板.png" class="card-bg" alt="角色1大圖" />
        <div class="avatar-wrapper">
          <img
            src="../img/角色/人物/力達.png"
            class="avatar-normal"
            alt="力達一般"
          />
          <img
            src="../img/角色/人物/力達2.png"
            class="avatar-hover"
            alt="力達換圖"
          />
        </div>
        <div class="input-wrapper">
          <img src="../img/角色/輸入框.png" class="input-bg" alt="輸入框底圖" />
          <input
            type="text"
            class="nickname-input"
            placeholder="Hung, Li-Da"
            maxlength="12"
          />
        </div>
        <button class="confirm-btn" onclick="confirmName(this)">
          <img src="../img/角色/ok按鈕.png" class="ok-normal" alt="確認名字" />
          <img
            src="../img/角色/ok按鈕淺.png"
            class="ok-hover"
            alt="確認名字淺色"
          />
        </button>
        <img
          src="../img/角色/數值/綠一.png"
          class="stat-item stat-pwr hover-zoom"
          alt="PWR數值"
        />
        <img
          src="../img/角色/數值/橘二.png"
          class="stat-item stat-skl hover-zoom"
          alt="SKL數值"
        />
        <img
          src="../img/角色/數值/藍三.png"
          class="stat-item stat-vcd hover-zoom"
          alt="VCD數值"
        />
        <img
          src="../img/角色/小按鈕四/左上紅.png"
          class="mini-btn btn-red hover-zoom"
          alt="紅色按鈕"
        />
        <img
          src="../img/角色/小按鈕四/左下藍.png"
          class="mini-btn btn-blue hover-zoom"
          alt="藍色按鈕"
        />
        <img
          src="../img/角色/小按鈕四/右上灰.png"
          class="mini-btn btn-cross hover-zoom"
          alt="十字按鈕"
        />
        <img
          src="../img/角色/小按鈕四/右下綠.png"
          class="mini-btn btn-green hover-zoom"
          alt="綠色按鈕"
        />
      </div>

      <!-- 角色卡片 2（李尉郎） -->
      <div class="card pos-center" data-char="角色 2">
        <img src="../img/角色/背板.png" class="card-bg" alt="角色2大圖" />
        <div class="avatar-wrapper">
          <img
            src="../img/角色/人物/阿郎.png"
            class="avatar-normal"
            alt="阿郎一般"
          />
          <img
            src="../img/角色/人物/阿郎2.png"
            class="avatar-hover"
            alt="阿郎換圖"
          />
        </div>
        <div class="input-wrapper">
          <img src="../img/角色/輸入框.png" class="input-bg" alt="輸入框底圖" />
          <input
            type="text"
            class="nickname-input"
            placeholder="Lee Weilang"
            maxlength="12"
          />
        </div>
        <button class="confirm-btn" onclick="confirmName(this)">
          <img src="../img/角色/ok按鈕.png" class="ok-normal" alt="確認名字" />
          <img
            src="../img/角色/ok按鈕淺.png"
            class="ok-hover"
            alt="確認名字淺色"
          />
        </button>
        <img
          src="../img/角色/數值/綠一.png"
          class="stat-item stat-pwr hover-zoom"
          alt="PWR數值"
        />
        <img
          src="../img/角色/數值/橘二.png"
          class="stat-item stat-skl hover-zoom"
          alt="SKL數值"
        />
        <img
          src="../img/角色/數值/藍三.png"
          class="stat-item stat-vcd hover-zoom"
          alt="VCD數值"
        />
        <img
          src="../img/角色/小按鈕四/左上紅.png"
          class="mini-btn btn-red hover-zoom"
          alt="紅色按鈕"
        />
        <img
          src="../img/角色/小按鈕四/左下藍.png"
          class="mini-btn btn-blue hover-zoom"
          alt="藍色按鈕"
        />
        <img
          src="../img/角色/小按鈕四/右上灰.png"
          class="mini-btn btn-cross hover-zoom"
          alt="十字按鈕"
        />
        <img
          src="../img/角色/小按鈕四/右下綠.png"
          class="mini-btn btn-green hover-zoom"
          alt="綠色按鈕"
        />
      </div>

      <!-- 角色卡片 3（陳光大） -->
      <div class="card pos-right" data-char="角色 3">
        <img src="../img/角色/背板.png" class="card-bg" alt="角色3大圖" />
        <div class="avatar-wrapper">
          <img
            src="../img/角色/人物/光大.png"
            class="avatar-normal"
            alt="光大一般"
          />
          <img
            src="../img/角色/人物/光大2.png"
            class="avatar-hover"
            alt="光大換圖"
          />
        </div>
        <div class="input-wrapper">
          <img src="../img/角色/輸入框.png" class="input-bg" alt="輸入框底圖" />
          <input
            type="text"
            class="nickname-input"
            placeholder="Guang-Dah Chen"
            maxlength="12"
          />
        </div>
        <button class="confirm-btn" onclick="confirmName(this)">
          <img src="../img/角色/ok按鈕.png" class="ok-normal" alt="確認名字" />
          <img
            src="../img/角色/ok按鈕淺.png"
            class="ok-hover"
            alt="確認名字淺色"
          />
        </button>
        <img
          src="../img/角色/數值/綠一.png"
          class="stat-item stat-pwr hover-zoom"
          alt="PWR數值"
        />
        <img
          src="../img/角色/數值/橘二.png"
          class="stat-item stat-skl hover-zoom"
          alt="SKL數值"
        />
        <img
          src="../img/角色/數值/藍三.png"
          class="stat-item stat-vcd hover-zoom"
          alt="VCD數值"
        />
        <img
          src="../img/角色/小按鈕四/左上紅.png"
          class="mini-btn btn-red hover-zoom"
          alt="紅色按鈕"
        />
        <img
          src="../img/角色/小按鈕四/左下藍.png"
          class="mini-btn btn-blue hover-zoom"
          alt="藍色按鈕"
        />
        <img
          src="../img/角色/小按鈕四/右上灰.png"
          class="mini-btn btn-cross hover-zoom"
          alt="十字按鈕"
        />
        <img
          src="../img/角色/小按鈕四/右下綠.png"
          class="mini-btn btn-green hover-zoom"
          alt="綠色按鈕"
        />
      </div>
    </div>

    <script>
      // 0. 抓取音效並設定音量（0.0 ~ 1.0）
      const sfxReady = document.getElementById("sfx-ready");
      const sfxArrow = document.getElementById("sfx-arrow");
      const sfxOk = document.getElementById("sfx-ok");

      if (sfxReady) sfxReady.volume = 0.7;
      if (sfxArrow) sfxArrow.volume = 0.6;
      if (sfxOk) sfxOk.volume = 0.75;

      // 共用播放小幫手（每次點擊從頭播放，支援快速連點）
      function playSound(audioEl) {
        if (audioEl) {
          audioEl.currentTime = 0;
          audioEl.play().catch(() => {});
        }
      }

      // ① 關閉開場說明彈窗（點擊 READY 時播放音效）
      const charIntroModal = document.getElementById("char-intro-modal");
      const closeIntroBtn = document.getElementById("close-intro-btn");

      if (closeIntroBtn && charIntroModal) {
        closeIntroBtn.addEventListener("click", () => {
          playSound(sfxReady); // 播放 READY 音效
          charIntroModal.style.display = "none";
        });
      }

      // ② 角色輪播與確認名字邏輯
      const cards = document.querySelectorAll(".card");
      const nextBtn = document.querySelector(".next-page-link");
      const arrowBtns = document.querySelectorAll(".arrow-btn");

      let positions = ["pos-left", "pos-center", "pos-right"];
      let isConfirmed = false;

      // 頁面剛載入時：鎖定 NEXT 按鈕，並只開放中間卡片輸入
      nextBtn.classList.add("disabled");
      updateCardStates();

      // 左右滑動切換角色（點擊左右箭頭時播放切換音效）
      function moveSlide(direction) {
        if (isConfirmed) return;

        playSound(sfxArrow); // 播放左右切換音效

        if (direction === 1) {
          positions.unshift(positions.pop());
        } else {
          positions.push(positions.shift());
        }

        cards.forEach((card, index) => {
          card.classList.remove("pos-left", "pos-center", "pos-right");
          card.classList.add(positions[index]);
        });

        updateCardStates();
      }

      // 更新卡片狀態（只有正中間的角色可以輸入名字與按 OK）
      function updateCardStates() {
        cards.forEach((card) => {
          const input = card.querySelector(".nickname-input");
          const okBtn = card.querySelector(".confirm-btn");

          if (card.classList.contains("pos-center") && !isConfirmed) {
            input.disabled = false;
            okBtn.disabled = false;
          } else {
            input.disabled = true;
            okBtn.disabled = true;
          }
        });
      }

      // ③ 按下 OK 按鈕確認角色與名字（播放 OK 確認音效 + 儲存角色給下一頁）
      function confirmName(btn) {
        playSound(sfxOk); // 播放 OK 確認音效

        const selectedCard = btn.closest(".card");
        const input = selectedCard.querySelector(".nickname-input");
        const playerName = input.value.trim() || input.placeholder;
        const charName = selectedCard.getAttribute("data-char");

        // 儲存玩家選的角色與名字，供下一頁草地走路小人與獎狀讀取
        localStorage.setItem("selectedCharacter", charName);
        localStorage.setItem("playerName", playerName);

        isConfirmed = true;
        input.value = playerName;
        input.disabled = true;
        btn.disabled = true;

        // 幫中間選中的角色加上「發光 + 放大縮小」Class
        selectedCard.classList.add("selected-glow");

        // 讓另外兩張卡片與左右箭頭自然淡出
        cards.forEach((c) => {
          if (c !== selectedCard) {
            c.style.opacity = "0";
            c.style.pointerEvents = "none";
          }
        });

        arrowBtns.forEach((arrow) => {
          arrow.style.opacity = "0";
          arrow.style.pointerEvents = "none";
        });

        // 解鎖右下角 NEXT 按鈕
        nextBtn.classList.remove("disabled");
      }

      // ④ 點擊右下角 NEXT 按鈕：共用 READY 音效，停頓 0.35 秒讓音效播完再跳轉下一頁
      let isNavigating = false;
      if (nextBtn) {
        nextBtn.addEventListener("click", (e) => {
          if (nextBtn.classList.contains("disabled")) {
            e.preventDefault();
            return;
          }
          e.preventDefault();
          if (isNavigating) return;
          isNavigating = true;

          playSound(sfxReady);

          const targetUrl = nextBtn.getAttribute("href");
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 350);
        });
      }
    </script>
  </body>
</html>
