<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>勇闖視傳系</title>
    <link rel="stylesheet" href="../css/style03.css" />
    <link rel="icon" type="image/png" href="../img/小裝飾/Iconeye1.png" />
  </head>

  <body>
    <!-- ① 關卡故事情境彈窗（純圖片 + 零跳動 READY 變色按鈕） -->
    <div id="story-modal" class="intro-overlay">
      <div class="intro-popup-box">
        <img
          id="story-popup-img"
          class="popup-main-img"
          src="../img/情境框/題目一情境.png"
          alt="關卡情境說明"
        />

        <div id="ready-btn" class="intro-ready-btn">
          <img
            class="intro-btn-normal"
            src="../img/按鈕/按鈕深ready.png"
            alt="READY"
          />
          <img
            class="intro-btn-hover"
            src="../img/按鈕/按鈕淺ready.png"
            alt="READY"
          />
        </div>
      </div>
    </div>

    <!-- 答題背景音樂 -->
    <audio
      id="quiz-bgm"
      src="../sound/做題中音樂.wav"
      loop
      preload="auto"
    ></audio>

    <!-- 按鈕與倒數點擊音效 -->
    <audio id="sfx-click" src="../sound/按鈕聲.wav" preload="auto"></audio>

    <audio id="sfx-countdown" src="../sound/倒數321.mp3" preload="auto"></audio>

    <!-- 答對與答錯音效 -->
    <audio id="sfx-correct" src="../sound/correct.mp3" preload="auto"></audio>
    <audio id="sfx-wrong" src="../sound/wrong.wav" preload="auto"></audio>

    <!-- 倒數 3、2、1、START 遮罩 -->
    <div id="countdown-overlay" class="overlay" style="display: none">
      <img src="../img/題目/倒數三.png" class="countdown-img" alt="3" />
      <img
        src="../img/題目/倒數二.png"
        class="countdown-img"
        style="display: none"
        alt="2"
      />
      <img
        src="../img/題目/倒數一.png"
        class="countdown-img"
        style="display: none"
        alt="1"
      />
      <img
        src="../img/題目/start.png"
        class="countdown-img"
        style="display: none"
        alt="START"
      />
    </div>

    <!-- ③-1 結算中過場動畫畫面（id 統一改為 calc-modal 與 JS 對齊） -->
    <div id="calc-modal" class="overlay" style="display: none">
      <div class="calc-box">
        <div class="calc-spinner"></div>
        <h2 class="calc-text">
          系統結算空間訊號中<span class="dots">...</span>
        </h2>
        <p class="calc-subtext">正在解析你的脫逃數據</p>
      </div>
    </div>

    <div id="success-modal" class="modal-overlay" style="display: none">
      <!-- 獎狀主容器（依你的設計圖比例設定） -->
      <div class="cert-container">
        <!-- 1. 獎狀底圖（包含背景、PASSED印章、拍下你的真實樣貌框等） -->
        <img
          src="../img/結算/獎狀底圖.png"
          class="cert-bg"
          alt="異世界逃脫證明書"
        />

        <!-- 2. 通關成績（對齊紅色橫幅中間的空白處） -->
        <div id="cert-score-display" class="cert-text score-pos">5</div>

        <!-- 3. 挑戰者名字（對齊「茲證明挑戰者 ____」的底線上方） -->
        <div id="cert-player-name" class="cert-text name-pos">視傳系勇者</div>

        <img
          id="cert-char-img"
          src="../img/角色/角色1金牌.png"
          class="cert-char"
          alt="通關角色"
        />
        <!-- 5. 右側相機拍照區（對齊灰色方框） -->
        <div class="camera-box">
          <video id="player-webcam" autoplay playsinline></video>
          <canvas id="photo-canvas" style="display: none"></canvas>
        </div>

        <!-- 6. 皇冠貼圖（疊在相機框右上角，z-index 設高一點才不會被相機蓋住） -->
        <img src="../img/結算/皇冠.png" class="cert-crown" alt="皇冠" />

        <!-- 7. 紅色小相機快門按鈕（疊在相機框右下角） -->
        <button id="snap-btn" class="img-btn snap-pos" onclick="takeSnapshot()">
          <img src="../img/結算/拍照按鈕.png" alt="拍照" />
        </button>
        <!-- 重拍按鈕（拍完照後切換顯示） -->
        <button
          id="retake-btn"
          class="img-btn snap-pos"
          onclick="retakePhoto()"
          style="display: none"
        >
          <img src="../img/結算/拍照按鈕.png" alt="重拍" />
        </button>

        <!-- 8. 右下角「分享逃脫結果」圖片按鈕 -->
        <button class="img-btn share-pos" onclick="shareResult()">
          <img src="../img/結算/分享按鈕.png" alt="分享逃脫結果" />
        </button>

        <!-- 9. 右下角「再玩一次」圖片按鈕 -->
        <button class="img-btn restart-pos" onclick="restartWholeGame()">
          <img src="../img/結算/再玩一次按鈕.png" alt="再玩一次" />
        </button>
      </div>
    </div>

    <!-- 3-3 挑戰失敗畫面（唯一一組，絕無重複） -->

    <!-- 第一階段：全螢幕滿版「失敗畫面.png」（藍色 FAIL 畫面） -->
    <div
      id="fail-intro-modal"
      class="blue-fail-fullscreen"
      style="display: none"
    >
      <img
        src="../img/結算/失敗畫面.png"
        class="blue-bg-cover"
        alt="失敗畫面"
      />
    </div>

    <!-- 第二階段：原比例置中「失敗提示.png」（顯示答對幾題 + 雙按鈕） -->
    <div id="fail-modal" class="white-fail-overlay" style="display: none">
      <div class="fail-dialog-window">
        <img
          src="../img/結算/失敗提示.png"
          class="dialog-window-img"
          alt="失敗提示"
        />

        <!-- 動態得分 -->
        <div id="fail-score-num" class="fail-score-pos">0</div>
        <!-- 總題數 5 -->
        <div class="fail-total-pos">5</div>

        <!-- 雙按鈕區 -->
        <div class="fail-btn-group">
          <button class="fail-img-btn" onclick="retryQuizOnly()">
            <img src="../img/結算/再玩一次按鈕.png" alt="再玩一次" />
          </button>
        </div>
      </div>
    </div>
    <!-- ④ 遊戲主畫面（滿版 16:9 容器） -->
    <div class="game-container">
      <img class="bg-img" src="../img/背景/題目背景倒方.png" alt="題目背景" />

      <div class="timer-track">
        <img
          id="timer-bar-img"
          src="../img/題目/倒數計時紅方.png"
          alt="倒數計時條"
        />
      </div>

      <img
        id="clue-img"
        class="clue-screen-img"
        src="../img/題目/圖片框.png"
        alt="線索圖"
      />
      <img
        id="pic-img"
        class="pic-img"
        src="../img/題目/題目一左內.png"
        alt="題目一左內"
      />
      <img
        id="right-frame-img"
        class="right-frame-img"
        src="../img/題目/題目框.png"
        alt="右側題目框"
      />
      <img
        id="question-img"
        class="question-title-img"
        src="../img/題目/題目一.png"
        alt="題目"
      />

      <div class="options-grid">
        <div class="option-item" data-index="0">
          <img class="opt-img" src="../img/題目/題目一a.png" alt="選項A" />
        </div>
        <div class="option-item" data-index="1">
          <img class="opt-img" src="../img/題目/題目一b.png" alt="選項B" />
        </div>
        <div class="option-item" data-index="2">
          <img class="opt-img" src="../img/題目/題目一c.png" alt="選項C" />
        </div>
        <div class="option-item" data-index="3">
          <img class="opt-img" src="../img/題目/題目一d.png" alt="選項D" />
        </div>
      </div>
    </div>

    <!-- 答對 / 答錯 結果圖片回饋畫面 -->
    <div id="feedback-overlay" class="overlay" style="display: none">
      <img
        id="feedback-correct-img"
        src="../img/題目/答對.png"
        alt="答對"
        style="display: none"
      />
      <img
        id="feedback-wrong-img"
        src="../img/題目/答錯.png"
        alt="答錯"
        style="display: none"
      />
    </div>

    <!-- 第一關：每題答完後的「解答視窗圖 + 右上角 X 按鈕」 -->
    <div
      id="answer-explain-modal"
      class="overlay"
      style="display: none; z-index: 960"
    >
      <div class="explain-img-wrapper">
        <!-- 每題對應的解答視窗圖片 -->
        <img
          id="explain-window-img"
          src="../img/題目/題目一解答.png"
          class="explain-window-img"
          alt="題目解答"
        />
        <!-- 右上角 X 關閉按鈕圖片 -->
        <button
          id="close-explain-btn"
          class="close-explain-btn"
          onclick="closeAnswerExplain()"
        >
          <img src="../img/題目/關閉按鈕.png" alt="關閉解答" />
        </button>
      </div>
    </div>

    <!-- 題目切換：電影感黑屏淡入淡出轉場遮罩 -->
    <div id="black-fade-transition" class="black-fade-overlay"></div>

    <!-- JavaScript 遊戲邏輯 -->
    <script>
      // 通知外層 index.html 停止背景音樂
      try {
        const parentBgm = window.parent.document.getElementById("global-bgm");
        const parentBgmBtn =
          window.parent.document.getElementById("global-bgm-btn");
        if (parentBgm) {
          parentBgm.pause();
          parentBgm.currentTime = 0;
        }
        if (parentBgmBtn) {
          parentBgmBtn.textContent = "🔇";
          parentBgmBtn.style.display = "none";
        }
      } catch (e) {}

      // 1. 五題完整題庫
      const quizData = [
        {
          showStory: true,
          storyImg: "../img/情境框/題目一情境.png",
          picImg: "../img/題目/題目一左內.png",
          questionImg: "../img/題目/題目一.png",
          optionImgs: [
            "../img/題目/題目一a.png",
            "../img/題目/題目一b.png",
            "../img/題目/題目一c.png",
            "../img/題目/題目一d.png",
          ],
          explainImg: "../img/題目/題目一解答.png",
          answer: 1,
        },
        {
          showStory: true,
          storyImg: "../img/情境框/題目二情境.png",
          picImg: "../img/題目/裸女.png",
          questionImg: "../img/題目/題目二.png",
          optionImgs: [
            "../img/題目/題目二a.png",
            "../img/題目/題目二b.png",
            "../img/題目/題目二c.png",
            "../img/題目/題目二d.png",
          ],
          explainImg: "../img/題目/題目二解答.png",
          answer: 1,
        },
        {
          showStory: true,
          storyImg: "../img/情境框/題目三情境.png",
          clueImg: "../img/題目/題目三合成圖.png",
          picImg: "",
          questionImg: "../img/題目/題目三.png",
          optionImgs: [
            "../img/題目/題目三a.png",
            "../img/題目/題目三b.png",
            "../img/題目/題目三c.png",
            "../img/題目/題目三d.png",
          ],
          explainImg: "../img/題目/題目三解答.png",
          answer: 1,
        },
        {
          showStory: true,
          storyImg: "../img/情境框/題目四情境.png",
          clueImg: "../img/題目/題目四合成圖.png",
          picImg: "",
          questionImg: "../img/題目/題目四.png",
          optionImgs: [
            "../img/題目/題目四a.png",
            "../img/題目/題目四b.png",
            "../img/題目/題目四c.png",
            "../img/題目/題目四d.png",
          ],
          explainImg: "../img/題目/題目四解答.png",
          answer: 2,
        },
        {
          showStory: true,
          storyImg: "../img/情境框/題目五情境.png",
          clueImg: "../img/題目/題目五合成圖.png",
          picImg: "",
          questionImg: "../img/題目/題目五.png",
          optionImgs: [
            "../img/題目/題目五a.png",
            "../img/題目/題目五b.png",
            "../img/題目/題目五c.png",
            "../img/題目/題目五d.png",
          ],
          explainImg: "../img/題目/題目五解答.png",
          answer: 3,
        },
      ];

      const correctImgSrc = "../img/題目/答對.png";
      const wrongImgSrc = "../img/題目/答錯.png";

      let currentIndex = 0;
      let score = 0;
      let quizTimer = null;
      let readyInterval = null;
      let isAnswering = false;
      let isCountingDown = false;
      let isBgmUnlocked = false;

      const storyModal = document.getElementById("story-modal");
      const storyPopupImg = document.getElementById("story-popup-img");
      const readyBtn = document.getElementById("ready-btn");
      const countdownOverlay = document.getElementById("countdown-overlay");
      const timerImg = document.getElementById("timer-bar-img");
      const picImg = document.getElementById("pic-img");
      const questionImg = document.getElementById("question-img");
      const optionItems = document.querySelectorAll(".option-item");
      const clueImg = document.getElementById("clue-img");

      const quizBgm = document.getElementById("quiz-bgm");
      const sfxCorrect = document.getElementById("sfx-correct");
      const sfxWrong = document.getElementById("sfx-wrong");
      const sfxClick = document.getElementById("sfx-click");
      const sfxCountdown = document.getElementById("sfx-countdown");

      if (quizBgm) quizBgm.volume = 0.3;
      if (sfxCorrect) sfxCorrect.volume = 0.75;
      if (sfxWrong) sfxWrong.volume = 0.7;
      if (sfxClick) sfxClick.volume = 0.65;
      if (sfxCountdown) sfxCountdown.volume = 0.75;

      function playClickSound() {
        if (sfxClick) {
          sfxClick.currentTime = 0;
          sfxClick.play().catch(() => {});
        }
      }

      function triggerPopAnimation(targetImg) {
        if (!targetImg) return;
        targetImg.classList.remove("pop-anim");
        void targetImg.offsetWidth;
        targetImg.classList.add("pop-anim");
      }

      // 預載所有圖片（不包含任何外部 DOM 陣列變數，絕不報錯）
      function preloadAllImages() {
        quizData.forEach((item) => {
          [
            item.storyImg,
            item.clueImg,
            item.picImg,
            item.questionImg,
            item.explainImg,
            ...item.optionImgs,
          ].forEach((src) => {
            if (src) {
              const im = new Image();
              im.src = src;
              if (im.decode) im.decode().catch(() => {});
            }
          });
        });
        [correctImgSrc, wrongImgSrc].forEach((src) => {
          const im = new Image();
          im.src = src;
          if (im.decode) im.decode().catch(() => {});
        });
      }
      function loadStage() {
        const data = quizData[currentIndex];
        clueImg.src = data.clueImg || "../img/題目/圖片框.png";

        if (data.picImg) {
          picImg.src = data.picImg;
          picImg.style.display = "block";
        } else {
          picImg.style.display = "none";
        }

        questionImg.src = data.questionImg;

        optionItems.forEach((item, idx) => {
          const imgTag = item.querySelector(".opt-img");
          if (data.optionImgs[idx]) {
            imgTag.src = data.optionImgs[idx];
            item.style.display = "block";
          } else {
            item.style.display = "none";
          }
        });

        if (data.showStory) {
          storyPopupImg.src = data.storyImg;
          storyModal.style.display = "flex";
        } else {
          startReadyCountdown();
        }
      }

      // 點擊 READY 按鈕
      readyBtn.addEventListener("click", () => {
        storyModal.style.display = "none";

        if (quizBgm && !isBgmUnlocked) {
          quizBgm.muted = true;
          quizBgm
            .play()
            .then(() => {
              quizBgm.pause();
              quizBgm.currentTime = 0;
              quizBgm.muted = false;
              isBgmUnlocked = true;
            })
            .catch(() => {});
        }

        startReadyCountdown();
      });

      document
        .querySelectorAll(".option-item, .pixel-action-btn")
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            playClickSound();
          });
        });

      // 3 ➔ 2 ➔ 1 ➔ START 零卡死倒數 ＋ 單一倒數音檔
      function startReadyCountdown() {
        if (isCountingDown) return;
        isCountingDown = true;

        if (readyInterval) {
          clearInterval(readyInterval);
          readyInterval = null;
        }

        const stepImgs = countdownOverlay.querySelectorAll("img");
        function showStep(idx) {
          stepImgs.forEach((img, i) => {
            if (i === idx) {
              img.style.display = "block";
              triggerPopAnimation(img);
            } else {
              img.style.display = "none";
            }
          });
        }

        countdownOverlay.style.display = "flex";
        let step = 0;

        // 顯示 3 並從頭播放完整的單一倒數音檔
        showStep(0);
        if (sfxCountdown) {
          sfxCountdown.muted = false;
          sfxCountdown.currentTime = 0;
          sfxCountdown.play().catch((err) => {
            console.log("倒數音檔未能播放（請檢查 HTML 的 src 檔名）：", err);
          });
        }

        readyInterval = setInterval(() => {
          step++;
          if (step < stepImgs.length) {
            showStep(step);
          } else {
            clearInterval(readyInterval);
            readyInterval = null;
            isCountingDown = false;
            countdownOverlay.style.display = "none";
            startQuestionTimer();
          }
        }, 1000);
      }

      function startQuestionTimer() {
        if (quizBgm) {
          quizBgm.muted = false;
          quizBgm.currentTime = 0;
          quizBgm.play().catch(() => {});
        }

        clearInterval(quizTimer);
        isAnswering = true;
        let timeLeft = 10;

        timerImg.style.transition = "none";
        timerImg.style.transform = "translateX(0%)";

        setTimeout(() => {
          timerImg.style.transition = "transform 10s linear";
          timerImg.style.transform = "translateX(-95%)";
        }, 50);

        quizTimer = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(quizTimer);
            isAnswering = false;
            showAnswerFeedback(false);
          }
        }, 1000);
      }

      optionItems.forEach((item) => {
        item.addEventListener("click", () => {
          if (!isAnswering) return;
          isAnswering = false;

          clearInterval(quizTimer);
          timerImg.style.transition = "none";

          const selectedIndex = parseInt(item.getAttribute("data-index"));
          const isCorrect = selectedIndex === quizData[currentIndex].answer;
          if (isCorrect) score++;

          showAnswerFeedback(isCorrect);
        });
      });

      function showAnswerFeedback(isCorrect) {
        if (quizBgm) {
          quizBgm.pause();
          quizBgm.currentTime = 0;
        }

        const overlay = document.getElementById("feedback-overlay");
        const correctImg = document.getElementById("feedback-correct-img");
        const wrongImg = document.getElementById("feedback-wrong-img");

        if (correctImg) {
          correctImg.style.display = "none";
          correctImg.classList.remove("pop-anim");
        }
        if (wrongImg) {
          wrongImg.style.display = "none";
          wrongImg.classList.remove("pop-anim");
        }

        if (overlay) {
          overlay.style.display = "flex";
          overlay.classList.remove("shake-red-fx", "flash-yellow-fx");
          void overlay.offsetWidth;
        }

        if (isCorrect) {
          if (correctImg) {
            correctImg.style.display = "block";
            triggerPopAnimation(correctImg);
          }
          if (overlay) overlay.classList.add("flash-yellow-fx");
          if (sfxCorrect) {
            sfxCorrect.currentTime = 0;
            sfxCorrect.play().catch(() => {});
          }
        } else {
          if (wrongImg) {
            wrongImg.style.display = "block";
            triggerPopAnimation(wrongImg);
          }
          if (overlay) overlay.classList.add("shake-red-fx");
          if (sfxWrong) {
            sfxWrong.currentTime = 0;
            sfxWrong.play().catch(() => {});
          }
        }

        setTimeout(() => {
          if (overlay) {
            overlay.style.display = "none";
            overlay.classList.remove("shake-red-fx", "flash-yellow-fx");
          }

          const explainModal = document.getElementById("answer-explain-modal");
          const explainWindowImg =
            document.getElementById("explain-window-img");
          const currentExplainSrc = quizData[currentIndex].explainImg;

          if (explainModal && explainWindowImg && currentExplainSrc) {
            explainWindowImg.src = currentExplainSrc;
            if (explainWindowImg.decode) {
              explainWindowImg
                .decode()
                .then(() => {
                  explainModal.style.display = "flex";
                })
                .catch(() => {
                  explainModal.style.display = "flex";
                });
            } else {
              explainWindowImg.onload = () => {
                explainModal.style.display = "flex";
              };
            }
          } else {
            nextQuestion();
          }
        }, 1200);
      }

      function closeAnswerExplain() {
        playClickSound();
        const explainModal = document.getElementById("answer-explain-modal");
        const blackFade = document.getElementById("black-fade-transition");

        if (currentIndex + 1 >= quizData.length) {
          if (explainModal) explainModal.style.display = "none";
          nextQuestion();
          return;
        }

        if (blackFade) blackFade.classList.add("is-black");

        setTimeout(() => {
          try {
            if (explainModal) explainModal.style.display = "none";
            nextQuestion();
          } finally {
            setTimeout(() => {
              if (blackFade) blackFade.classList.remove("is-black");
            }, 150);
          }
        }, 380);
      }

      function nextQuestion() {
        currentIndex++;
        isAnswering = false;
        isCountingDown = false;

        if (currentIndex < quizData.length) {
          loadStage();
        } else {
          showFinalResult();
        }
      }

      function showFinalResult() {
        if (quizBgm) {
          quizBgm.pause();
          quizBgm.currentTime = 0;
        }
        localStorage.setItem("stage1Score", score);

        const calcModal = document.getElementById("calc-modal");
        if (calcModal) {
          const calcText = calcModal.querySelector(".calc-text");
          const calcSubtext = calcModal.querySelector(".calc-subtext");
          if (calcText) calcText.textContent = "第一關空間謎題完成！";
          if (calcSubtext)
            calcSubtext.textContent = "正在前往第二關：色彩敏感度測試...";
          calcModal.style.display = "flex";
        }

        setTimeout(() => {
          window.location.href = "../04/04.html";
        }, 1800);
      }

      // 啟動預載與第一關
      preloadAllImages();
      loadStage();
    </script>
  </body>
</html>
