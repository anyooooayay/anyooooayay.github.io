<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勇闖視傳系</title>
    <link rel="stylesheet" href="../css/style03.css" />
    <link rel="icon" type="image/png" href="../img/小裝飾/Iconeye1.png" />
  </head>
  <body>
    <!-- ① 關卡故事情境彈窗（純圖片 + 零跳動 READY 變色按鈕） -->
    <div id="story-modal" class="intro-overlay">
      <div class="intro-popup-box">
        <img
          id="story-popup-img"
          class="popup-main-img"
          src="../img/情境框/題目一情境.png"
          alt="關卡情境說明"
        />

        <div id="ready-btn" class="intro-ready-btn">
          <img
            class="intro-btn-normal"
            src="../img/按鈕/按鈕深ready.png"
            alt="READY"
          />
          <img
            class="intro-btn-hover"
            src="../img/按鈕/按鈕淺ready.png"
            alt="READY"
          />
        </div>
      </div>
    </div>

    <!-- 答題背景音樂 -->
    <audio
      id="quiz-bgm"
      src="../sound/做題中音樂.wav"
      loop
      preload="auto"
    ></audio>

    <!-- 按鈕與倒數點擊音效 -->
    <audio id="sfx-click" src="../sound/按鈕聲.wav" preload="auto"></audio>

    <!-- 答對與答錯音效 -->
    <audio id="sfx-correct" src="../audio/correct.mp3" preload="auto"></audio>
    <audio id="sfx-wrong" src="../audio/wrong.mp3" preload="auto"></audio>

    <!-- ② 3、2、1、START 準備倒數畫面 -->
    <div id="countdown-overlay" class="overlay" style="display: none">
      <img
        id="countdown-img"
        class="countdown-pic"
        src="../img/題目/倒數三.png"
        alt="倒數圖片"
      />
    </div>

    <!-- ③-1 結算中過場動畫畫面（id 統一改為 calc-modal 與 JS 對齊） -->
    <div id="calc-modal" class="overlay" style="display: none">
      <div class="calc-box">
        <div class="calc-spinner"></div>
        <h2 class="calc-text">
          系統結算空間訊號中<span class="dots">...</span>
        </h2>
        <p class="calc-subtext">正在解析你的脫逃數據</p>
      </div>
    </div>

    <div id="success-modal" class="modal-overlay" style="display: none">
      <!-- 獎狀主容器（依你的設計圖比例設定） -->
      <div class="cert-container">
        <!-- 1. 獎狀底圖（包含背景、PASSED印章、拍下你的真實樣貌框等） -->
        <img
          src="../img/結算/獎狀底圖.png"
          class="cert-bg"
          alt="異世界逃脫證明書"
        />

        <!-- 2. 通關成績（對齊紅色橫幅中間的空白處） -->
        <div id="cert-score-display" class="cert-text score-pos">5</div>

        <!-- 3. 挑戰者名字（對齊「茲證明挑戰者 ____」的底線上方） -->
        <div id="cert-player-name" class="cert-text name-pos">視傳系勇者</div>

        <img
          id="cert-char-img"
          src="../img/角色/角色1金牌.png"
          class="cert-char"
          alt="通關角色"
        />
        <!-- 5. 右側相機拍照區（對齊灰色方框） -->
        <div class="camera-box">
          <video id="player-webcam" autoplay playsinline></video>
          <canvas id="photo-canvas" style="display: none"></canvas>
        </div>

        <!-- 6. 皇冠貼圖（疊在相機框右上角，z-index 設高一點才不會被相機蓋住） -->
        <img src="../img/結算/皇冠.png" class="cert-crown" alt="皇冠" />

        <!-- 7. 紅色小相機快門按鈕（疊在相機框右下角） -->
        <button id="snap-btn" class="img-btn snap-pos" onclick="takeSnapshot()">
          <img src="../img/結算/拍照按鈕.png" alt="拍照" />
        </button>
        <!-- 重拍按鈕（拍完照後切換顯示） -->
        <button
          id="retake-btn"
          class="img-btn snap-pos"
          onclick="retakePhoto()"
          style="display: none"
        >
          <img src="../img/結算/拍照按鈕.png" alt="重拍" />
        </button>

        <!-- 8. 右下角「分享逃脫結果」圖片按鈕 -->
        <button class="img-btn share-pos" onclick="shareResult()">
          <img src="../img/結算/分享按鈕.png" alt="分享逃脫結果" />
        </button>

        <!-- 9. 右下角「再玩一次」圖片按鈕 -->
        <button class="img-btn restart-pos" onclick="restartWholeGame()">
          <img src="../img/結算/再玩一次按鈕.png" alt="再玩一次" />
        </button>
      </div>
    </div>

    <!-- 3-3 挑戰失敗畫面（唯一一組，絕無重複） -->

    <!-- 第一階段：全螢幕滿版「失敗畫面.png」（藍色 FAIL 畫面） -->
    <div
      id="fail-intro-modal"
      class="blue-fail-fullscreen"
      style="display: none"
    >
      <img
        src="../img/結算/失敗畫面.png"
        class="blue-bg-cover"
        alt="失敗畫面"
      />
    </div>

    <!-- 第二階段：原比例置中「失敗提示.png」（顯示答對幾題 + 雙按鈕） -->
    <div id="fail-modal" class="white-fail-overlay" style="display: none">
      <div class="fail-dialog-window">
        <img
          src="../img/結算/失敗提示.png"
          class="dialog-window-img"
          alt="失敗提示"
        />

        <!-- 動態得分 -->
        <div id="fail-score-num" class="fail-score-pos">0</div>
        <!-- 總題數 5 -->
        <div class="fail-total-pos">5</div>

        <!-- 雙按鈕區 -->
        <div class="fail-btn-group">
          <button class="fail-img-btn" onclick="retryQuizOnly()">
            <img src="../img/結算/再玩一次按鈕.png" alt="再玩一次" />
          </button>
          <button class="fail-img-btn" onclick="restartWholeGame()">
            <img src="../img/結算/回到首頁按鈕.png" alt="回到首頁" />
          </button>
        </div>
      </div>
    </div>
    <!-- ④ 遊戲主畫面（滿版 16:9 容器） -->
    <div class="game-container">
      <img class="bg-img" src="../img/背景/題目背景倒方.png" alt="題目背景" />

      <div class="timer-track">
        <img
          id="timer-bar-img"
          src="../img/題目/倒數計時紅方.png"
          alt="倒數計時條"
        />
      </div>

      <img
        id="clue-img"
        class="clue-screen-img"
        src="../img/題目/圖片框.png"
        alt="線索圖"
      />
      <img
        id="pic-img"
        class="pic-img"
        src="../img/題目/題目一左內.png"
        alt="題目一左內"
      />
      <img
        id="right-frame-img"
        class="right-frame-img"
        src="../img/題目/題目框.png"
        alt="右側題目框"
      />
      <img
        id="question-img"
        class="question-title-img"
        src="../img/題目/題目一.png"
        alt="題目"
      />

      <div class="options-grid">
        <div class="option-item" data-index="0">
          <img class="opt-img" src="../img/題目/題目一a.png" alt="選項A" />
        </div>
        <div class="option-item" data-index="1">
          <img class="opt-img" src="../img/題目/題目一b.png" alt="選項B" />
        </div>
        <div class="option-item" data-index="2">
          <img class="opt-img" src="../img/題目/題目一c.png" alt="選項C" />
        </div>
        <div class="option-item" data-index="3">
          <img class="opt-img" src="../img/題目/題目一d.png" alt="選項D" />
        </div>
      </div>
    </div>

    <!-- 答對 / 答錯 結果圖片回饋畫面 -->
    <div id="feedback-overlay" class="overlay" style="display: none">
      <img
        id="feedback-correct-img"
        src="../img/題目/答對.png"
        alt="答對"
        style="display: none"
      />
      <img
        id="feedback-wrong-img"
        src="../img/題目/答錯.png"
        alt="答錯"
        style="display: none"
      />
    </div>
    <!-- JavaScript 遊戲邏輯 -->
    <script>
      // 一進入 03.html 題目頁，立刻通知外層 index.html 停止原本的背景音樂
      try {
        const parentBgm = window.parent.document.getElementById("global-bgm");
        const parentBgmBtn =
          window.parent.document.getElementById("global-bgm-btn");

        if (parentBgm) {
          parentBgm.pause(); // 暫停外層背景音樂
          parentBgm.currentTime = 0; // 將播放進度歸零
        }
        if (parentBgmBtn) {
          parentBgmBtn.textContent = "🔇"; // 同步把外層右上角的喇叭圖示變成靜音
          parentBgmBtn.style.display = "none"; // 如果進到題目頁也不想看到外層喇叭按鈕，可保留這行直接隱藏它
        }
      } catch (e) {
        console.log("無法存取外層音樂（可能是單獨開啟 03.html 測試）");
      }

      // 1. 五題完整題庫（每一題都有情境框，並自動切換 picImg、questionImg、optionImgs）
      const quizData = [
        {
          // 第 1 題
          showStory: true,
          storyImg: "../img/情境框/題目一情境.png",
          picImg: "../img/題目/題目一左內.png",
          questionImg: "../img/題目/題目一.png",
          optionImgs: [
            "../img/題目/題目一a.png",
            "../img/題目/題目一b.png",
            "../img/題目/題目一c.png",
            "../img/題目/題目一d.png",
          ],
          answer: 1, // B (0=A, 1=B, 2=C, 3=D)
        },
        {
          // 第 2 題
          showStory: true,
          storyImg: "../img/情境框/題目二情境.png",
          picImg: "../img/題目/裸女.png",
          questionImg: "../img/題目/題目二.png",
          optionImgs: [
            "../img/題目/題目二a.png",
            "../img/題目/題目二b.png",
            "../img/題目/題目二c.png",
            "../img/題目/題目二d.png",
          ],
          answer: 1, // B
        },
        {
          // 第 3 題
          showStory: true,
          storyImg: "../img/情境框/題目三情境.png",
          clueImg: "../img/題目/題目三合成圖.png", // ← 換成你們合成好的第 3 題左側大圖檔名
          picImg: "", // ← 留空，程式會自動隱藏內圖
          questionImg: "../img/題目/題目三.png",
          optionImgs: [
            "../img/題目/題目三a.png",
            "../img/題目/題目三b.png",
            "../img/題目/題目三c.png",
            "../img/題目/題目三d.png",
          ],
          answer: 1, // B
        },
        {
          // 第 4 題
          showStory: true,
          storyImg: "../img/情境框/題目四情境.png",
          clueImg: "../img/題目/題目四合成圖.png", // ← 換成你們合成好的第 4 題左側大圖檔名
          picImg: "", // ← 留空，程式會自動隱藏內圖
          questionImg: "../img/題目/題目四.png",
          optionImgs: [
            "../img/題目/題目四a.png",
            "../img/題目/題目四b.png",
            "../img/題目/題目四c.png",
            "../img/題目/題目四d.png",
          ],
          answer: 2, // C
        },
        {
          // 第 5 題
          showStory: true,
          storyImg: "../img/情境框/題目五情境.png",
          clueImg: "../img/題目/題目五合成圖.png", // ← 換成你們合成好的第 5 題左側大圖檔名
          picImg: "", // ← 留空，程式會自動隱藏內圖
          questionImg: "../img/題目/題目五.png",
          optionImgs: [
            "../img/題目/題目五a.png",
            "../img/題目/題目五b.png",
            "../img/題目/題目五c.png",
            "../img/題目/題目五d.png",
          ],
          answer: 3, // D
        },
      ];

      // 2. 倒數圖片 & 答對/答錯圖片路徑（請確認答對、答錯的檔名是否正確）
      const countdownImages = [
        "../img/題目/倒數三.png",
        "../img/題目/倒數二.png",
        "../img/題目/倒數一.png",
        "../img/題目/start.png",
      ];
      const correctImgSrc = "../img/題目/答對.png"; // ← 請確認你們的「答對圖」檔名
      const wrongImgSrc = "../img/題目/失敗.png"; // ← 請確認你們的「答錯圖」檔名

      let currentIndex = 0;
      let score = 0;
      let quizTimer = null;
      let isAnswering = false; // 防止玩家重複點擊選項

      // 3. 統一抓取所有 HTML 元素
      const storyModal = document.getElementById("story-modal");
      const storyPopupImg = document.getElementById("story-popup-img");
      const readyBtn = document.getElementById("ready-btn");
      const countdownOverlay = document.getElementById("countdown-overlay");
      const countdownImg = document.getElementById("countdown-img");
      const feedbackOverlay = document.getElementById("feedback-overlay");
      const feedbackImg = document.getElementById("feedback-img");
      const timerImg = document.getElementById("timer-bar-img");
      const picImg = document.getElementById("pic-img");
      const questionImg = document.getElementById("question-img");
      const optionItems = document.querySelectorAll(".option-item");
      const clueImg = document.getElementById("clue-img");
      const quizBgm = document.getElementById("quiz-bgm");
      let isBgmUnlocked = false;
      const sfxCorrect = document.getElementById("sfx-correct");
      const sfxWrong = document.getElementById("sfx-wrong");

      // 黃金音量比例：背景音樂柔和陪襯 (0.3)，答題音效清脆明顯 (0.75)
      if (quizBgm) quizBgm.volume = 0.3;
      if (sfxCorrect) sfxCorrect.volume = 0.75;
      if (sfxWrong) sfxWrong.volume = 0.7;
      // 4. 背景預載所有圖片（包含題庫、倒數圖與答對/答錯圖）
      function preloadAllImages() {
        quizData.forEach((item) => {
          if (item.storyImg) new Image().src = item.storyImg;
          if (item.clueImg) new Image().src = item.clueImg;
          if (item.picImg) new Image().src = item.picImg;
          if (item.questionImg) new Image().src = item.questionImg;
          item.optionImgs.forEach((src) => {
            new Image().src = src;
          });
        });

        countdownImages.forEach((src) => {
          new Image().src = src;
        });

        new Image().src = correctImgSrc;
        new Image().src = wrongImgSrc;
      }

      // 第 5 區：載入當前題目
      function loadStage() {
        const data = quizData[currentIndex];

        // 第 1～3 題沒設 clueImg，自動維持預設外框；第 4、5 題則換成合成大圖
        clueImg.src = data.clueImg || "../img/題目/圖片框.png";

        // 有設內圖（第 1～3 題）就顯示；留空（第 4、5 題）就直接隱藏
        if (data.picImg) {
          picImg.src = data.picImg;
          picImg.style.display = "block";
        } else {
          picImg.style.display = "none";
        }

        questionImg.src = data.questionImg;

        optionItems.forEach((item, idx) => {
          const imgTag = item.querySelector(".opt-img");
          if (data.optionImgs[idx]) {
            imgTag.src = data.optionImgs[idx];
            item.style.display = "block";
          } else {
            item.style.display = "none";
          }
        });

        if (data.showStory) {
          storyPopupImg.src = data.storyImg;
          storyModal.style.display = "flex";
        } else {
          startReadyCountdown();
        }
      }

      /// 點擊 READY 按鈕
      readyBtn.addEventListener("click", () => {
        storyModal.style.display = "none";

        // 先在點擊瞬間「靜音預熱」解鎖瀏覽器播放權限，等 321 結束再正式出聲
        if (quizBgm && !isBgmUnlocked) {
          quizBgm.muted = true;
          quizBgm
            .play()
            .then(() => {
              quizBgm.pause();
              quizBgm.currentTime = 0;
              quizBgm.muted = false;
              isBgmUnlocked = true;
            })
            .catch(() => {});
        }

        startReadyCountdown();
      });

      // 共用按鈕與倒數音效設定
      const sfxClick = document.getElementById("sfx-click");
      if (sfxClick) sfxClick.volume = 0.65;

      function playClickSound() {
        if (sfxClick) {
          sfxClick.currentTime = 0;
          sfxClick.play().catch(() => {});
        }
      }

      // 自動幫所有可點擊的按鈕加上點擊音效
      document
        .querySelectorAll("#ready-btn, .option-item, .pixel-action-btn")
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            playClickSound();
          });
        });

      // 依序播放 4 張倒數圖片（3 ➔ 2 ➔ 1 ➔ START）＋ 每一下都同步播放音效
      function startReadyCountdown() {
        countdownOverlay.style.display = "flex";
        let step = 0;

        // 顯示第 1 張（數字 3）並播放第 1 聲
        countdownImg.src = countdownImages[0];
        triggerPopAnimation(countdownImg); // 正確傳入 countdownImg
        playClickSound(); // 同步播放音效

        const readyInterval = setInterval(() => {
          step++;
          if (step < countdownImages.length) {
            // 依序切換成 2 ➔ 1 ➔ START 並播放音效
            countdownImg.src = countdownImages[step];
            triggerPopAnimation(countdownImg);
            playClickSound();
          } else {
            clearInterval(readyInterval);
            countdownOverlay.style.display = "none";
            startQuestionTimer();
          }
        }, 1000);
      }

      // 圖片彈出動畫共用函式
      function triggerPopAnimation(targetImg) {
        targetImg.classList.remove("pop-anim");
        void targetImg.offsetWidth;
        targetImg.classList.add("pop-anim");
      }

      // 10 秒作答計時（3、2、1、START 結束後正式進入題目並從頭播放音樂）
      function startQuestionTimer() {
        if (quizBgm) {
          quizBgm.muted = false;
          quizBgm.currentTime = 0;
          quizBgm.play().catch(() => {});
        }

        clearInterval(quizTimer);
        isAnswering = true;
        let timeLeft = 10;

        timerImg.style.transition = "none";
        timerImg.style.transform = "translateX(0%)";

        setTimeout(() => {
          timerImg.style.transition = "transform 10s linear";
          timerImg.style.transform = "translateX(-95%)";
        }, 50);

        quizTimer = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(quizTimer);
            isAnswering = false;
            showAnswerFeedback(false);
          }
        }, 1000);
      }

      // 7. 點擊選項判斷對錯與計分
      optionItems.forEach((item) => {
        item.addEventListener("click", () => {
          if (!isAnswering) return;
          isAnswering = false;

          clearInterval(quizTimer);
          timerImg.style.transition = "none";

          const selectedIndex = parseInt(item.getAttribute("data-index"));
          const isCorrect = selectedIndex === quizData[currentIndex].answer;

          if (isCorrect) {
            score++;
          }

          showAnswerFeedback(isCorrect);
        });
      });

      // 8. 顯示答對／答錯圖片（完全對應你現在的 feedback-correct-img / feedback-wrong-img）
      function showAnswerFeedback(isCorrect) {
        if (quizBgm) {
          quizBgm.pause();
          quizBgm.currentTime = 0;
        }

        const overlay = document.getElementById("feedback-overlay");
        const correctImg = document.getElementById("feedback-correct-img");
        const wrongImg = document.getElementById("feedback-wrong-img");

        // 先重置兩張圖的狀態
        if (correctImg) {
          correctImg.style.display = "none";
          correctImg.classList.remove("pop-anim");
        }
        if (wrongImg) {
          wrongImg.style.display = "none";
          wrongImg.classList.remove("pop-anim");
        }

        if (overlay) {
          overlay.style.display = "flex";
          overlay.classList.remove("shake-red-fx", "flash-yellow-fx");
          void overlay.offsetWidth;
        }

        if (isCorrect) {
          if (correctImg) correctImg.style.display = "block";
          if (overlay) overlay.classList.add("flash-yellow-fx");
          if (sfxCorrect) {
            sfxCorrect.currentTime = 0;
            sfxCorrect.play().catch(() => {});
          }
        } else {
          if (wrongImg) {
            wrongImg.style.display = "block";
            if (typeof triggerPopAnimation === "function") {
              triggerPopAnimation(wrongImg);
            }
          }
          if (overlay) overlay.classList.add("shake-red-fx");
          if (sfxWrong) {
            sfxWrong.currentTime = 0;
            sfxWrong.play().catch(() => {});
          }
        }

        setTimeout(() => {
          if (overlay) {
            overlay.style.display = "none";
            overlay.classList.remove("shake-red-fx", "flash-yellow-fx");
          }
          nextQuestion();
        }, 2000);
      }

      // 9. 切換下一題或進入結算
      function nextQuestion() {
        currentIndex++;
        if (currentIndex < quizData.length) {
          loadStage();
        } else {
          showFinalResult();
        }
      }

      // 角色對照表（指向戴金牌的結算專用圖，並相容各種儲存名稱）
      const resultCharacterMap = {
        "角色 1": "../img/角色/角色1金牌.png",
        "角色 2": "../img/角色/角色2金牌.png",
        "角色 3": "../img/角色/角色3金牌.png",
        角色1: "../img/角色/角色1金牌.png",
        角色2: "../img/角色/角色2金牌.png",
        角色3: "../img/角色/角色3金牌.png",
        1: "../img/角色/角色1金牌.png",
        2: "../img/角色/角色2金牌.png",
        3: "../img/角色/角色3金牌.png",
      };

      // 10. 答題結束：先播放「結算中動畫」2.2 秒，再依分數跳轉成功或失敗畫面
      function showFinalResult() {
        if (quizBgm) {
          quizBgm.pause();
          quizBgm.currentTime = 0;
        }

        const calcModal = document.getElementById("calc-modal");
        if (calcModal) {
          calcModal.style.display = "flex";
        }

        setTimeout(() => {
          if (calcModal) {
            calcModal.style.display = "none";
          }

          // 徹底隱藏底層題目畫面，避免透明處透出重疊
          const gameContainer = document.querySelector(".game-container");
          if (gameContainer) gameContainer.style.display = "none";

          const savedName = localStorage.getItem("playerName") || "視傳系勇者";
          const savedChar =
            localStorage.getItem("selectedCharacter") || "角色 1";

          if (score >= 3) {
            // --- 通關成功 ---
            const nameEl = document.getElementById("cert-player-name");
            if (nameEl) nameEl.textContent = savedName;

            const scoreEl = document.getElementById("cert-score-display");
            if (scoreEl) scoreEl.textContent = `${score}/5`;

            const certCharImg = document.getElementById("cert-char-img");
            if (certCharImg && resultCharacterMap[savedChar]) {
              certCharImg.src = resultCharacterMap[savedChar];
            }

            const successModal = document.getElementById("success-modal");
            if (successModal) successModal.style.display = "flex";

            if (typeof startWebcam === "function") startWebcam();
          } else {
            // --- 通關失敗 ---
            const failIntro = document.getElementById("fail-intro-modal");
            const failModal = document.getElementById("fail-modal");
            const failScoreNum = document.getElementById("fail-score-num");

            if (failScoreNum) failScoreNum.textContent = score;

            // 先強制確保兩個失敗頁不會同時顯示
            if (failModal) failModal.style.display = "none";

            if (failIntro && failModal) {
              failIntro.style.display = "block";
              setTimeout(() => {
                failIntro.style.display = "none";
                failModal.style.display = "flex";
              }, 1800);
            }
          }
        }, 2200);
      }

      // 11. 分享脫逃結果功能
      function shareResult() {
        const savedName = localStorage.getItem("playerName") || "視傳系勇者";
        const shareText = `【勇闖視傳系 ESCAPE FROM VCD】挑戰者「${savedName}」成功解開 ${score}/5 道空間謎題，順利逃出異世界啦！快來一起挑戰看看！`;
        const shareUrl = window.location.origin;

        if (navigator.share) {
          navigator
            .share({
              title: "勇闖視傳系 ESCAPE FROM VCD",
              text: shareText,
              url: shareUrl,
            })
            .catch(() => {});
        } else {
          const failIntro = document.getElementById("fail-intro-modal");
          const introBadge = document.getElementById("fail-intro-score-badge");
          const introScoreVal = document.getElementById("intro-score-val");
          const failModal = document.getElementById("fail-modal");
          const failScoreNum = document.getElementById("fail-score-num");

          // 填入分數
          if (introScoreVal) introScoreVal.textContent = score;
          if (failScoreNum) failScoreNum.textContent = score;

          // 階段 1（0 秒）：先顯示滿版藍色「FAIL 提示畫面」
          if (failModal) failModal.style.display = "none";
          if (introBadge) introBadge.style.display = "none";
          if (failIntro) failIntro.style.display = "block";

          // 階段 2（1.0 秒後）：在藍色 FAIL 下方跳出「顯示對幾題」
          setTimeout(() => {
            if (introBadge) introBadge.style.display = "block";
          }, 1000);

          // 階段 3（2.8 秒後）：關閉藍色 FAIL，跳到原比例置中的「挑戰失敗頁面」
          setTimeout(() => {
            if (failIntro) failIntro.style.display = "none";
            if (failModal) failModal.style.display = "flex";
          }, 2800);
        }
      }

      // 啟動預載與第一關
      preloadAllImages();
      loadStage();

      // 按鈕 1：再玩一次（不回首頁，直接留在 03.html 從第 1 題重新挑戰）
      function retryQuizOnly() {
        window.location.reload();
      }

      // 按鈕 2：回到首頁（跳回 01.html）
      function restartWholeGame() {
        try {
          if (webcamStream) {
            webcamStream.getTracks().forEach((track) => track.stop());
          }
          const parentBgmBtn =
            window.parent.document.getElementById("global-bgm-btn");
          if (parentBgmBtn) parentBgmBtn.style.display = "flex";
        } catch (e) {}

        window.location.href = "../0102/01.html";
      }
      let webcamStream = null;

      // 1. 啟動前鏡頭相機（在 showFinalResult() 裡 score >= 3 時呼叫它！）
      function startWebcam() {
        const video = document.getElementById("player-webcam");
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices
            .getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then((stream) => {
              webcamStream = stream;
              video.srcObject = stream;
            })
            .catch((err) => {
              console.log("無法開啟相機（可能未授權或無鏡頭）：", err);
              alert("請允許瀏覽器使用相機，才能拍下通關紀念照喔！");
            });
        }
      }

      // 2. 按下「拍下通關照」快門
      function takeSnapshot() {
        const video = document.getElementById("player-webcam");
        const canvas = document.getElementById("photo-canvas");
        const snapBtn = document.getElementById("snap-btn");
        const retakeBtn = document.getElementById("retake-btn");

        // 設定畫布尺寸與鏡頭一致，並把當前畫面畫上去定格
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 400;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 隱藏動態鏡頭，顯示定格照片
        video.style.display = "none";
        canvas.style.display = "block";

        // 切換按鈕為「重拍一張」
        snapBtn.style.display = "none";
        retakeBtn.style.display = "inline-block";

        // 播放快門音效（共用你們的按鈕音效）
        if (typeof playClickSound === "function") playClickSound();
      }

      // 3. 按下「重拍一張」恢復即時鏡頭
      function retakePhoto() {
        const video = document.getElementById("player-webcam");
        const canvas = document.getElementById("photo-canvas");
        const snapBtn = document.getElementById("snap-btn");
        const retakeBtn = document.getElementById("retake-btn");

        canvas.style.display = "none";
        video.style.display = "block";

        retakeBtn.style.display = "none";
        snapBtn.style.display = "inline-block";
      }
    </script>
  </body>
</html>
