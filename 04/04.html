<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勇闖視傳系</title>
    <link rel="stylesheet" href="../css/style04.css" />
    <link rel="icon" type="image/png" href="../img/小裝飾/Iconeye1.png" />
  </head>
  <body>
    <!-- 共用點擊音效 -->
    <audio id="sfx-click" src="../sound/按鈕聲.wav" preload="auto"></audio>

    <!-- 第二關：關卡說明彈窗（一進畫面先顯示） -->
    <div id="color-intro-modal" class="intro-modal-overlay">
      <div class="intro-pixel-box">
        <div class="intro-badge">STAGE 02 // 關卡說明</div>
        <h2 class="intro-title">色彩敏感度校準挑戰</h2>
        <div class="intro-rules">
          <p>1. 觀察左側「題目目標色」展示的標準色票。</p>
          <p>2. 點擊右側「你的調色盤」色塊開啟檢色器。</p>
          <p>3. 拖曳調色盤與色相條調出最接近的顏色。</p>
          <p class="highlight-rule">
            ★ 相似度達 85% 以上即算挑戰成功（共 3 題）！
          </p>
        </div>
        <button class="intro-start-btn" onclick="startColorStage()">
          開始校色 READY
        </button>
      </div>
    </div>

    <div class="game-container">
      <!-- 頂部資訊列 -->
      <div class="stage-header">
        <span>STAGE 02 // 色彩敏感度測試</span>
        <span id="q-progress">第 1 / 3 題</span>
        <span id="stage-score-display">本關得分：0</span>
      </div>

      <!-- 左右主區域 -->
      <div class="color-arena">
        <!-- 左側：題目 -->
        <div class="left-question-panel">
          <div class="panel-tag">題目目標色</div>
          <div id="question-text" class="question-desc">
            第一題：請觀察左方色塊，調出飽滿的「視傳活力橘」！
          </div>
          <div id="target-swatch" class="target-swatch-box"></div>
          <div class="hint-note">達標門檻：相似度 85% 以上</div>
        </div>

        <!-- 右側：點擊色塊開啟檢色器 -->
        <div class="right-picker-panel">
          <div class="panel-tag" style="background: #2b579a">你的調色盤</div>
          <div class="question-desc">點擊下方色塊開啟檢色器</div>

          <div
            id="player-swatch"
            class="player-swatch-wrapper"
            onclick="openColorPicker()"
          >
            <span class="click-tip">🎨 點此調色</span>
          </div>

          <div id="hex-text" class="hex-readout">目前色碼：#808080</div>
        </div>
      </div>

      <button class="submit-color-btn" onclick="checkColorAnswer()">
        確認送出顏色
      </button>
    </div>

    <!-- 點擊色塊後開啟的「2D 檢色器浮動視窗」 -->
    <div id="picker-modal" onclick="closePickerOnBackdrop(event)">
      <div class="picker-dialog">
        <div class="picker-main-row">
          <div class="sv-box-wrap" id="sv-box">
            <canvas id="sv-canvas" width="260" height="260"></canvas>
            <div id="sv-cursor"></div>
          </div>

          <div class="hue-bar-wrap" id="hue-box">
            <canvas id="hue-canvas" width="24" height="260"></canvas>
            <div id="hue-cursor"></div>
          </div>
        </div>

        <div class="picker-footer">
          <div class="modal-preview-info">
            <div id="modal-color-dot"></div>
            <span id="modal-hex-label">#808080</span>
          </div>
          <button class="picker-confirm-btn" onclick="closeColorPicker()">
            確定選色
          </button>
        </div>
      </div>
    </div>

    <!-- 相似度結果回饋彈窗 -->
    <div id="similarity-overlay">
      <div class="result-popup">
        <div id="sim-title" class="sim-msg">色彩比對結果</div>
        <div id="sim-percent-text" class="sim-percent sim-pass">92% 相似</div>
        <div id="sim-detail-text" class="sim-msg">太神啦！精準命中目標色！</div>
      </div>
    </div>
    <script>
      // 3 道設計主題色票題目（已更新為你要的新色票）
      const colorQuestions = [
        {
          title: "第一題：請觀察左方色塊，調出飽滿的「視傳活力橘」！",
          targetHex: "#ff5500",
        },
        {
          title: "第二題：印刷設計必考！<br>請調出左方的「標準青藍色（Cyan）」",
          targetHex: "#00a0e9",
        },
        {
          title: "第三題：數位介面常用色！<br>請調出左方的「賽博薄荷綠」",
          targetHex: "#18c98d",
        },
      ];

      let currentQ = 0;
      let colorScore = 0;
      let isLocked = false;

      let currentH = 0;
      let currentS = 0;
      let currentV = 0.5;
      let currentPickedHex = "#808080";

      const pickerModal = document.getElementById("picker-modal");
      const svCanvas = document.getElementById("sv-canvas");
      const svCtx = svCanvas.getContext("2d");
      const svBox = document.getElementById("sv-box");
      const svCursor = document.getElementById("sv-cursor");

      const hueCanvas = document.getElementById("hue-canvas");
      const hueCtx = hueCanvas.getContext("2d");
      const hueBox = document.getElementById("hue-box");
      const hueCursor = document.getElementById("hue-cursor");

      const playerSwatch = document.getElementById("player-swatch");
      const clickTip = document.querySelector(".click-tip"); // 👈 新增這行
      const modalColorDot = document.getElementById("modal-color-dot");
      const modalHexLabel = document.getElementById("modal-hex-label");
      const hexText = document.getElementById("hex-text");
      const targetSwatch = document.getElementById("target-swatch");
      const questionText = document.getElementById("question-text");
      const qProgress = document.getElementById("q-progress");
      const stageScoreDisplay = document.getElementById("stage-score-display");
      const sfxClick = document.getElementById("sfx-click");

      // 點擊「開始校色 READY」關閉關卡說明彈窗
      function startColorStage() {
        if (sfxClick) {
          sfxClick.currentTime = 0;
          sfxClick.play().catch(() => {});
        }
        const introModal = document.getElementById("color-intro-modal");
        if (introModal) introModal.style.display = "none";
      }

      function closeColorPicker() {
        if (sfxClick) {
          sfxClick.currentTime = 0;
          sfxClick.play().catch(() => {});
        }
        pickerModal.style.display = "none";

        // 選好顏色後隱藏「點此調色」文字，方便純粹比對顏色
        if (clickTip) clickTip.style.display = "none";
        playerSwatch.style.border = "5px solid #3b1e10";
      }

      // 點擊深色背景遮罩也能直接收起檢色器
      function closePickerOnBackdrop(e) {
        if (e.target === pickerModal) {
          closeColorPicker();
        }
      }

      // 繪製右側彩虹色相條
      function drawHueBar() {
        const grad = hueCtx.createLinearGradient(0, 0, 0, hueCanvas.height);
        grad.addColorStop(0.0, "#ff0000");
        grad.addColorStop(0.17, "#ff00ff");
        grad.addColorStop(0.33, "#0000ff");
        grad.addColorStop(0.5, "#00ffff");
        grad.addColorStop(0.67, "#00ff00");
        grad.addColorStop(0.83, "#ffff00");
        grad.addColorStop(1.0, "#ff0000");
        hueCtx.fillStyle = grad;
        hueCtx.fillRect(0, 0, hueCanvas.width, hueCanvas.height);
      }

      // 繪製 2D 明暗飽和度方塊
      function drawSVBox() {
        const w = svCanvas.width;
        const h = svCanvas.height;

        svCtx.fillStyle = `hsl(${currentH}, 100%, 50%)`;
        svCtx.fillRect(0, 0, w, h);

        const whiteGrad = svCtx.createLinearGradient(0, 0, w, 0);
        whiteGrad.addColorStop(0, "rgba(255,255,255,1)");
        whiteGrad.addColorStop(1, "rgba(255,255,255,0)");
        svCtx.fillStyle = whiteGrad;
        svCtx.fillRect(0, 0, w, h);

        const blackGrad = svCtx.createLinearGradient(0, 0, 0, h);
        blackGrad.addColorStop(0, "rgba(0,0,0,0)");
        blackGrad.addColorStop(1, "rgba(0,0,0,1)");
        svCtx.fillStyle = blackGrad;
        svCtx.fillRect(0, 0, w, h);
      }
      function hsvToHex(h, s, v) {
        const c = v * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = v - c;
        let r = 0,
          g = 0,
          b = 0;

        if (h < 60) {
          r = c;
          g = x;
          b = 0;
        } else if (h < 120) {
          r = x;
          g = c;
          b = 0;
        } else if (h < 180) {
          r = 0;
          g = c;
          b = x;
        } else if (h < 240) {
          r = 0;
          g = x;
          b = c;
        } else if (h < 300) {
          r = x;
          g = 0;
          b = c;
        } else {
          r = c;
          g = 0;
          b = x;
        }

        const toHex = (n) =>
          Math.round((n + m) * 255)
            .toString(16)
            .padStart(2, "0");
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }

      function updatePickedColor() {
        currentPickedHex = hsvToHex(currentH, currentS, currentV);
        const upperHex = currentPickedHex.toUpperCase();

        playerSwatch.style.backgroundColor = currentPickedHex;
        modalColorDot.style.backgroundColor = currentPickedHex;
        modalHexLabel.textContent = upperHex;
        hexText.textContent = `目前色碼：${upperHex}`;

        svCursor.style.left = `${currentS * 100}%`;
        svCursor.style.top = `${(1 - currentV) * 100}%`;
        hueCursor.style.top = `${((360 - currentH) / 360) * 100}%`;
      }

      function handleSVMove(clientX, clientY) {
        const rect = svBox.getBoundingClientRect();
        const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
        const y = Math.max(0, Math.min(rect.height, clientY - rect.top));
        currentS = x / rect.width;
        currentV = 1 - y / rect.height;
        updatePickedColor();
      }

      function handleHueMove(clientY) {
        const rect = hueBox.getBoundingClientRect();
        const y = Math.max(0, Math.min(rect.height, clientY - rect.top));
        const ratio = y / rect.height;
        currentH = (1 - ratio) * 360;
        if (currentH >= 360) currentH = 359.9;
        drawSVBox();
        updatePickedColor();
      }

      let draggingSV = false;
      let draggingHue = false;

      svBox.addEventListener("mousedown", (e) => {
        draggingSV = true;
        handleSVMove(e.clientX, e.clientY);
      });
      hueBox.addEventListener("mousedown", (e) => {
        draggingHue = true;
        handleHueMove(e.clientY);
      });

      window.addEventListener("mousemove", (e) => {
        if (draggingSV) handleSVMove(e.clientX, e.clientY);
        if (draggingHue) handleHueMove(e.clientY);
      });
      window.addEventListener("mouseup", () => {
        draggingSV = false;
        draggingHue = false;
      });

      // 觸控螢幕支援
      svBox.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          draggingSV = true;
          handleSVMove(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: false },
      );
      hueBox.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          draggingHue = true;
          handleHueMove(e.touches[0].clientY);
        },
        { passive: false },
      );
      window.addEventListener(
        "touchmove",
        (e) => {
          if (draggingSV)
            handleSVMove(e.touches[0].clientX, e.touches[0].clientY);
          if (draggingHue) handleHueMove(e.touches[0].clientY);
        },
        { passive: false },
      );
      window.addEventListener("touchend", () => {
        draggingSV = false;
        draggingHue = false;
      });

      function loadColorQuestion() {
        isLocked = false;
        const q = colorQuestions[currentQ];
        questionText.innerHTML = q.title; // 👈 改成 innerHTML 才會識別 <br> 換行！
        targetSwatch.style.backgroundColor = q.targetHex;
        qProgress.textContent = `第 ${currentQ + 1} / ${colorQuestions.length} 題`;

        // 換新題目時，重新顯示「點此調色」提示與虛線框
        if (clickTip) clickTip.style.display = "block";
        playerSwatch.style.border = "5px dashed #d6362e";

        currentH = 0;
        currentS = 0;
        currentV = 0.5;
        updatePickedColor();
      }

      function hexToRgb(hex) {
        const clean = hex.replace("#", "");
        return {
          r: parseInt(clean.substring(0, 2), 16),
          g: parseInt(clean.substring(2, 4), 16),
          b: parseInt(clean.substring(4, 6), 16),
        };
      }

      function calculateSimilarity(hex1, hex2) {
        const c1 = hexToRgb(hex1);
        const c2 = hexToRgb(hex2);
        const dist = Math.sqrt(
          Math.pow(c1.r - c2.r, 2) +
            Math.pow(c1.g - c2.g, 2) +
            Math.pow(c1.b - c2.b, 2),
        );
        return Math.max(0, Math.round((1 - dist / 441.67) * 100));
      }

      function checkColorAnswer() {
        if (isLocked) return;
        isLocked = true;
        if (sfxClick) {
          sfxClick.currentTime = 0;
          sfxClick.play().catch(() => {});
        }

        const targetHex = colorQuestions[currentQ].targetHex;
        const similarity = calculateSimilarity(targetHex, currentPickedHex);
        const isPass = similarity >= 85;

        if (isPass) {
          colorScore++;
          stageScoreDisplay.textContent = `本關得分：${colorScore}`;
        }

        const overlay = document.getElementById("similarity-overlay");
        const percentText = document.getElementById("sim-percent-text");
        const detailText = document.getElementById("sim-detail-text");

        percentText.textContent = `${similarity}% 相似`;
        percentText.className = `sim-percent ${isPass ? "sim-pass" : "sim-fail"}`;
        detailText.textContent = isPass
          ? "色感超準！成功通過校色！"
          : `差了一點點（標準色碼為 ${targetHex.toUpperCase()}）`;

        overlay.style.display = "flex";

        setTimeout(() => {
          overlay.style.display = "none";
          currentQ++;
          if (currentQ < colorQuestions.length) {
            loadColorQuestion();
          } else {
            localStorage.setItem("stage2Score", colorScore);
            window.location.href = "../05/05.html";
          }
        }, 2000);
      }

      loadColorQuestion();
    </script>
  </body>
</html>
